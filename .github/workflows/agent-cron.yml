name: ChamaScore agent run

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-run
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run autonomous agent pass
        env:
          # Set repo variable CHAMASCORE_NETWORK=mainnet to flip the cron to
          # Celo mainnet. Unset -> defaults to celo-sepolia (no behavior change).
          CHAMASCORE_NETWORK: ${{ vars.CHAMASCORE_NETWORK }}
          CHAMASCORE_PRIVATE_KEY: ${{ secrets.CHAMASCORE_PRIVATE_KEY }}
          CELO_SEPOLIA_RPC_URL: ${{ secrets.CELO_SEPOLIA_RPC_URL }}
          CELO_RPC_URL: ${{ secrets.CELO_RPC_URL }}
        run: npm run agent:run

      - name: Commit updated run log
        run: |
          git config user.name "chamascore-agent[bot]"
          git config user.email "chamascore-agent@users.noreply.github.com"
          git add public/agent-runs.json artifacts/agent-runs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "agent: record autonomous run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
